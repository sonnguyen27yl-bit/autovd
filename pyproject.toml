[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "autovd"
version = "0.1.0.dev0"
description = "ChatGPT-native full-auto cleanup for AI-generated video clips"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp[cli]==2.0.0",
  "pydantic==2.13.4",
]

[project.scripts]
autovd-mcp = "autovd.mcp_server:main"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autovd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["autovd"]
mypy_path = "src"
