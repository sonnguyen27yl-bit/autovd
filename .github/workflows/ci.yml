name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up Node for MCP Inspector
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Install locked dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Test
        run: uv run pytest -q

      - name: Verify MCP Streamable HTTP with Inspector
        run: |
          set -euo pipefail

          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=s=64x64:r=10:d=1.5" -an /tmp/spike.mp4

          AUTOVD_SPIKE_VIDEO=/tmp/spike.mp4 \
            uv run autovd-mcp >/tmp/autovd-mcp.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("AutoVD MCP server did not start")
          PY

          npx --yes @modelcontextprotocol/inspector@2.2.0 --cli \
            http://127.0.0.1:8000/mcp --transport http \
            --method tools/list --format json > /tmp/tools.json

          npx --yes @modelcontextprotocol/inspector@2.2.0 --cli \
            http://127.0.0.1:8000/mcp --transport http \
            --method tools/call --tool-name health --format json > /tmp/health.json

          npx --yes @modelcontextprotocol/inspector@2.2.0 --cli \
            http://127.0.0.1:8000/mcp --transport http \
            --method tools/call --tool-name get_temporal_analysis_demo \
            --tool-args-json '{"interval_ms":500,"max_frames":3}' \
            --format json > /tmp/temporal.json

          python - <<'PY'
          import json
          from pathlib import Path

          tools = json.loads(Path("/tmp/tools.json").read_text())
          health = json.loads(Path("/tmp/health.json").read_text())
          temporal = json.loads(Path("/tmp/temporal.json").read_text())
          tools_text = json.dumps(tools, sort_keys=True)
          health_text = json.dumps(health, sort_keys=True)
          temporal_text = json.dumps(temporal, sort_keys=True)

          assert '"health"' in tools_text
          assert '"get_temporal_analysis_demo"' in tools_text
          assert '"service": "autovd"' in health_text
          assert '"status": "ok"' in health_text
          assert '"spike_fixture"' in temporal_text
          assert '"image/png"' in temporal_text
          assert '"timestamp_ms=0"' in temporal_text
          assert '"timestamp_ms=500"' in temporal_text
          assert '"timestamp_ms=1000"' in temporal_text
          PY
