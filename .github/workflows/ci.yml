name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node for MCP Inspector
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Resolve and install locked dependencies
        run: |
          uv lock
          uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Verify MCP Streamable HTTP with Inspector
        run: |
          set -euo pipefail
          uv run autovd-mcp >/tmp/autovd-mcp.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 8000), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("AutoVD MCP server did not start")
          PY

          npx --yes @modelcontextprotocol/inspector@2.2.0 --cli \
            http://127.0.0.1:8000/mcp --transport http \
            --method tools/list --format json > /tmp/tools.json

          npx --yes @modelcontextprotocol/inspector@2.2.0 --cli \
            http://127.0.0.1:8000/mcp --transport http \
            --method tools/call --tool-name health --format json > /tmp/health.json

          python - <<'PY'
          import json
          from pathlib import Path

          tools = json.loads(Path("/tmp/tools.json").read_text())
          health = json.loads(Path("/tmp/health.json").read_text())
          tools_text = json.dumps(tools, sort_keys=True)
          health_text = json.dumps(health, sort_keys=True)
          assert '"health"' in tools_text
          assert '"get_temporal_analysis_demo"' in tools_text
          assert '"service": "autovd"' in health_text
          assert '"status": "ok"' in health_text
          PY

      - name: Commit bootstrap lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: lock Python dependencies"
          git push
